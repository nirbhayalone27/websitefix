<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebsiteFix — Clear website audits</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#171717;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.08em}header span{color:#777}h1{font-size:clamp(45px,8vw,85px);letter-spacing:-.065em;line-height:1.05;margin:110px 0 24px}p{color:#666;max-width:600px}form{display:flex;gap:10px;margin:34px 0}input{flex:1;min-width:0;border:1px solid #ccc;border-radius:9px;padding:16px;font:inherit}button{background:#171717;color:white;border:0;border-radius:9px;padding:16px 22px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}section{border-top:1px solid #ddd;margin-top:40px;padding-top:20px}.score{font-size:54px;letter-spacing:-.05em;font-weight:700}.issue{border-bottom:1px solid #ddd;padding:14px 0}.issue small{color:#777;text-transform:uppercase}footer{color:#888;font-size:13px;margin-top:80px}@media(max-width:540px){form{flex-direction:column}h1{margin-top:70px}}</style><main><header>WEBSITEFIX <span>OPEN SOURCE / BETA</span></header><h1>Find what your<br>website misses.</h1><p>Focused technical checks. Clear evidence. Actionable fixes. No invented rankings or inflated claims.</p><form id="form"><input id="url" type="url" required placeholder="https://yourwebsite.com" aria-label="Website URL"><button id="submit">Run audit</button></form><p id="message" role="status"></p><section id="results" hidden><div class="score" id="score"></div><p id="summary"></p><button id="download" type="button">Download JSON report</button><div id="issues"></div></section><footer>WebsiteFix · Basic HTML, SEO, accessibility and security-header checks. Not a full Lighthouse or WCAG audit.</footer></main><script>let report;const $=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='Scanning website…';$('results').hidden=true;try{const r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Scan failed');report=d;$('score').textContent=d.score+'/100';$('summary').textContent='Heuristic score · '+d.issues.length+' findings · '+d.duration_ms+' ms';$('issues').replaceChildren();for(const i of d.issues){const div=document.createElement('div');div.className='issue';const strong=document.createElement('strong');strong.textContent=i.title;const small=document.createElement('small');small.textContent=i.severity;const p=document.createElement('p');p.textContent=i.evidence+' — '+i.fix;div.append(small,document.createElement('br'),strong,p);$('issues').append(div)}$('results').hidden=false;$('message').textContent='Audit complete'}catch(err){$('message').textContent=err.message}finally{$('submit').disabled=false}};$('download').onclick=()=>{if(!report)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='websitefix-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></html>
